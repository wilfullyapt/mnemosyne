name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mnemosyne
          POSTGRES_PASSWORD: mnemosyne
          POSTGRES_DB: mnemosyne_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mnemosyne -d mnemosyne_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mnemosyne:mnemosyne@localhost:5432/mnemosyne_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: CLI golden path
        run: |
          mnemosyne migrate
          mnemosyne ingest-golden --no-migrate
          mnemosyne reviews --limit 5
